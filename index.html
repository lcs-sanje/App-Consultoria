<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Consultoria Integrada | Educação Física & Nutrição</title>

    <!-- Configuração PWA (Progressive Web App) para Instalação no Celular (Brave, Chrome, Safari) -->
    <meta name="theme-color" content="#52735C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Consultoria App" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sage: {
                50: '#F4F7F4',
                100: '#E6EFE8',
                200: '#CFE0D3',
                300: '#B0CBB7',
                400: '#8BAE95',
                500: '#6B9076',
                600: '#52735C',
                700: '#415B49',
                800: '#35493C',
                900: '#2C3C32',
              },
              clay: {
                50: '#F9F6F3',
                100: '#F0EAE3',
                200: '#E2D6C8',
                300: '#CEB9A5',
                400: '#B5997F',
                500: '#9B7E63',
                600: '#82664E',
                700: '#6A523F',
                800: '#584436',
                900: '#49392E',
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-[#F5F4F0] text-stone-800 antialiased selection:bg-sage-200 selection:text-stone-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js', { scope: './' })
            .catch((err) => console.warn('Falha ao registrar Service Worker PWA:', err));
        });
      }
    </script>
  </body>
</html>
